# Hytale tunnel overlay — Hyprland rules.
# Include from your config:   source = ~/.local/lib/hytale_tunnel/hyprland.conf
# then apply with:            hyprctl reload
# The overlay sets app-id (class) "hytale-tunnel". We match by CLASS, not title:
# the app-id is set at window creation, but Qt sets the title slightly later, so a
# title match races and sometimes fails to apply (window ends up tiled/unpinned).

# Hyprland 0.55 syntax: matchers (match:...) come first, rules last.
windowrule = match:class ^(hytale-tunnel)$, float on
windowrule = match:class ^(hytale-tunnel)$, pin on
# Fully opaque window surface + NO backdrop blur, so the overlay reads as truly
# transparent (the see-through look comes from the widgets' own low background alpha,
# HYTALE_TUNNEL_BG_ALPHA). Global blur would otherwise frost the translucent areas;
# `no_blur on` is the JaKooLit/Hyprland 0.55 rule name (underscore, takes a value).
windowrule = match:class ^(hytale-tunnel)$, opacity 1.0 1.0
windowrule = match:class ^(hytale-tunnel)$, no_blur on
# Positioning is done by the app (hyprctl dispatch) because the 'move' rule and
# client-set positions are unreliable on Wayland. Do NOT add a 'size' rule (pins
# the size, breaks the ESC pill) or 'nofocus' (blocks typing).

# Global collapse/expand toggle that works EVEN WHEN THE GAME IS FOCUSED.
# It signals exactly the running tunnel via its PID file (safe: no broad pkill that
# could hit other processes). Pick a combo that doesn't clash with your JaKooLit
# binds — check first with:   hyprctl binds | grep -iE 'SUPER'
# Default is SUPER+SHIFT+J; change freely.
bind = SUPER SHIFT, J, exec, kill -USR1 "$(cat ~/.hytalecrypt/tunnel.pid 2>/dev/null)" 2>/dev/null

# Toggle focus: press once to focus the overlay (type), press again to return to
# the game. (Script needed because Hyprland binds can't branch on the active window.)
bind = SUPER SHIFT, P, exec, bash ~/.local/lib/hytale_tunnel/focus-toggle.sh

# Quick-open: press '\' to open (enlarge) the chat AND focus the compose bar in one go
# (signals RTMIN+3). NOTE: this is a bare key with no modifier, so Hyprland consumes '\'
# globally — you won't be able to type a literal backslash in other apps (or in the chat
# itself) while this bind exists. Change ', backslash' to e.g. 'SUPER, backslash' if that
# bothers you. SUPER+SHIFT+J already enlarges+focuses too (it toggles).
bind = , backslash, exec, /usr/bin/kill --signal RTMIN+3 "$(cat ~/.hytalecrypt/tunnel.pid 2>/dev/null)" 2>/dev/null

# Font size: bigger = SUPER+SHIFT++, smaller = SUPER+SHIFT+-. Works even while the
# game is focused. Signals the overlay via real-time signals (RTMIN+1 bigger, RTMIN+2
# smaller) to its PID file. We use /usr/bin/kill (util-linux) because /bin/sh's builtin
# kill may not accept RTMIN+N. Both keysyms are bound per action ('equal'/'plus' and
# 'minus'/'underscore') so it fires regardless of how Shift transforms the keysym.
bind = SUPER SHIFT, equal, exec, /usr/bin/kill --signal RTMIN+1 "$(cat ~/.hytalecrypt/tunnel.pid 2>/dev/null)" 2>/dev/null
bind = SUPER SHIFT, plus,  exec, /usr/bin/kill --signal RTMIN+1 "$(cat ~/.hytalecrypt/tunnel.pid 2>/dev/null)" 2>/dev/null
bind = SUPER SHIFT, minus, exec, /usr/bin/kill --signal RTMIN+2 "$(cat ~/.hytalecrypt/tunnel.pid 2>/dev/null)" 2>/dev/null
bind = SUPER SHIFT, underscore, exec, /usr/bin/kill --signal RTMIN+2 "$(cat ~/.hytalecrypt/tunnel.pid 2>/dev/null)" 2>/dev/null
